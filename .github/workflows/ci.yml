# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/042-simplified-github-ci-release-safe/
# Release safety details:
# https://arran4.github.io/blog/post/2026/041-release-safe-single-owner-github-ci/
# Built using these posts as reference/guidance.
name: CI/CD

on:
  push:
    branches: [main, master]
    # semantic version tags + rc/beta snapshots
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        description: "Optional explicit release version (for example 2.4.0 or 2.4.0-rc.2)"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    # preferred heavy monthly run (quota reset strategy)
    - cron: '17 3 1 * *'
    # optional nightly lightweight checks
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  pull-requests: read

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_pr_meta_checks: ${{ steps.route.outputs.run_pr_meta_checks }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_post_release: ${{ steps.route.outputs.run_post_release }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          run_code_checks=false
          run_pr_meta_checks=false
          run_cleanup=false
          run_release=false
          run_post_release=false
          is_monthly=false
          is_nightly=false

          case "${{ github.event_name }}" in
            push)
              run_code_checks=true
              if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.ref }}" != refs/tags/test-* ]]; then
                run_release=true
              fi
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                run_pr_meta_checks=true
                run_code_checks=true
              fi
              ;;
            release)
              run_post_release=true
              ;;
            workflow_dispatch)
              case "${{ inputs.mode }}" in
                lint-fix)
                  run_code_checks=true
                  is_nightly=true
                  ;;
                build)
                  run_code_checks=true
                  ;;
                release-*)
                  run_code_checks=true
                  run_release=true
                  ;;
                publish-tag)
                  if [[ "${{ github.ref_type }}" != "tag" || ! "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
                    echo "publish-tag mode requires an eligible tag context (e.g. refs/tags/v*)" >&2
                    exit 1
                  fi
                  run_code_checks=true
                  run_release=true
                  ;;
                monthly-maintenance)
                  run_code_checks=true
                  is_monthly=true
                  ;;
              esac
              ;;
            schedule)
              run_code_checks=true
              if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
                is_monthly=true
              fi
              if [[ "${{ github.event.schedule }}" == "41 2 * * *" ]]; then
                is_nightly=true
              fi
              ;;
          esac

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_pr_meta_checks=$run_pr_meta_checks" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "run_post_release=$run_post_release" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup != 'true' && (needs.route.outputs.is_nightly == 'true' || needs.route.outputs.is_monthly == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review (public/full)
    needs: [route]
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4

  node-lint-test:
    name: Node lint/test
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - name: Build source npm package
        run: npm pack --json > npm-pack-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: npm-source-package
          retention-days: 1
          path: |
            *.tgz
            npm-pack-result.json


  autofix:
    name: Auto-format and open PR
    needs: [route]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Run autofix formatters
        shell: bash
        run: |
          set -euo pipefail
          if true; then
            npm ci || true
            npx prettier . --write || true
          fi

      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes; exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PARENT_PR="${{ github.event.pull_request.number || 'none' }}"
          if [ "$PARENT_PR" = "none" ]; then
            PARENT_PR="${{ github.run_id }}"
          fi
          BRANCH="ci/autofix/${{ github.run_id }}-parent-${PARENT_PR}"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ci: automated formatting fixes"

          git push -f origin "$BRANCH"

          gh pr create \
            --title "ci: automated formatting fixes" \
            --body "Automated formatting pass. Parent-PR: ${PARENT_PR}" \
            --base main \
            --head "$BRANCH" \
            --label "ci-autofix"


  cleanup-autofix-prs:
    name: Cleanup autofix PRs on parent close
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list --state open --search "label:ci-autofix in:title" --json number,headRefName,body |             jq -r '.[] | select(.body | contains("Parent-PR: '"$PARENT_PR"'")) | [.number, .headRefName] | @tsv' |             while IFS=$'	' read -r pr branch; do
              gh pr close "$pr" --comment "Closing auto-fix PR because parent PR #$PARENT_PR was closed."
              git push origin --delete "$branch" || true
            done


  release-validation:
    name: Release Validation Gate
    needs: [route, node-lint-test]
    if: |
      !failure() && !cancelled() &&
      needs.route.result == 'success' &&
      needs.node-lint-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required tests passed."

  release-context:
    name: Release Context & Gate
    needs: [route, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
      npm_tag: ${{ steps.export.outputs.npm_tag }}
      is_prerelease: ${{ steps.export.outputs.is_prerelease }}
      next_dev_version: ${{ steps.export.outputs.next_dev_version }}
      version_changed: ${{ steps.export.outputs.version_changed }}
      prepare_next: ${{ steps.export.outputs.prepare_next }}
      current_version: ${{ steps.export.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Normalize and tag execution
        id: export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # First calculate the version variables since BOTH paths need them (for outputs)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          export CURRENT_VERSION

          if git show HEAD^:package.json > /tmp/prev-package.json 2>/dev/null; then
            PREVIOUS_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/prev-package.json','utf8')).version")
          else
            PREVIOUS_VERSION=""
          fi

          if [ "${CURRENT_VERSION}" != "${PREVIOUS_VERSION}" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          TAG="v${CURRENT_VERSION}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${CURRENT_VERSION}" != *-* && "${CURRENT_VERSION}" != "${PREVIOUS_VERSION}" ]]; then
            echo "prepare_next=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare_next=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${CURRENT_VERSION}" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          node <<'NODE'
          const fs = require('fs');
          const current = process.env.CURRENT_VERSION;
          function nextPatch(version) {
            const [major, minor, patchPart] = version.split('.');
            const numericPatch = parseInt(patchPart.split('-')[0], 10);
            return `${major}.${minor}.${numericPatch + 1}`;
          }
          const nextDev = `${nextPatch(current)}-next`;
          fs.writeFileSync('/tmp/next-dev-version', nextDev);
          NODE
          NEXT_DEV_VERSION=$(cat /tmp/next-dev-version)
          echo "next_dev_version=${NEXT_DEV_VERSION}" >> "$GITHUB_OUTPUT"

          # Now handle the early exits for publish-tag mode or push
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "publish-tag" ]]; then
            if [[ "${{ github.ref_type }}" != "tag" ]]; then
              echo "Error: publish-tag mode invoked on a non-tag ref." >&2
              exit 1
            fi

            if [[ "${{ github.ref_name }}" != "v${CURRENT_VERSION}" ]]; then
              echo "Error: Tag ${{ github.ref_name }} does not match package version v${CURRENT_VERSION}." >&2
              exit 1
            fi

            echo "Running in internal publisher mode; tag is immutable context."
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
             if [[ "${{ github.ref_name }}" != "v${CURRENT_VERSION}" ]]; then
               echo "Error: Pushed tag ${{ github.ref_name }} does not match package version v${CURRENT_VERSION}." >&2
               exit 1
             fi
             echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          # Handle manual bump and tag
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          MODE="${{ inputs.mode }}"
          OVERRIDE="${{ inputs.release_version_override }}"

          if [ -n "$OVERRIDE" ]; then
             OVERRIDE="${OVERRIDE#v}"
             npm version "$OVERRIDE" --no-git-tag-version
          else
             case "$MODE" in
               release-major) LEVEL="major"; SUFFIX="" ;;
               release-minor) LEVEL="minor"; SUFFIX="" ;;
               release-patch) LEVEL="patch"; SUFFIX="" ;;
               release-test) LEVEL="prerelease"; SUFFIX="next" ;;
               release-rc) LEVEL="prerelease"; SUFFIX="rc" ;;
               release-alpha) LEVEL="prerelease"; SUFFIX="alpha" ;;
               *) LEVEL=""; SUFFIX="" ;;
             esac
             if [ -n "$LEVEL" ]; then
                if [ "$LEVEL" == "prerelease" ]; then
                   npm version prerelease --preid="$SUFFIX" --no-git-tag-version
                else
                   npm version "$LEVEL" --no-git-tag-version
                fi
             fi
          fi

          # recalculate if bumped
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"

          if [ -n "$OVERRIDE" ] || [ -n "$LEVEL" ]; then
            git add package.json package-lock.json
            git commit -m "chore: bump version to $CURRENT_VERSION"

            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

            # Step 1: Capture validated SHA (from github context, the commit this job ran on)
            VALIDATED_SHA="${GITHUB_SHA}"

            # Step 2: Verify remote branch hasn't moved
            git fetch origin ${{ github.ref_name }}
            CURRENT_REMOTE_SHA=$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | awk '{print $1}')
            if [[ "$CURRENT_REMOTE_SHA" != "$VALIDATED_SHA" ]]; then
              echo "Error: Remote branch ${{ github.ref_name }} has moved to $CURRENT_REMOTE_SHA. Expected $VALIDATED_SHA." >&2
              echo "Failing closed to prevent race condition during release." >&2
              exit 1
            fi

            # Step 3: Push bump commit as normal fast-forward
            git push origin HEAD:${{ github.ref_name }} || {
               echo "Error: Branch push failed completely." >&2
               exit 1
            }

            NEW_SHA=$(git rev-parse HEAD)

            # Step 4: Verify remote branch SHA is exactly NEW_SHA before tagging
            VERIFY_BRANCH_SHA=$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | awk '{print $1}')
            if [[ "$VERIFY_BRANCH_SHA" != "$NEW_SHA" ]]; then
               echo "Error: Remote branch is at $VERIFY_BRANCH_SHA but we expected our pushed commit $NEW_SHA. Failing closed." >&2
               exit 1
            fi

            # Step 5: Create/push tag
            git tag "$TAG" "${NEW_SHA}"
            git push origin "$TAG" || (
              VERIFY_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
              if [[ "$VERIFY_TAG_SHA" == "${NEW_SHA}" ]]; then
                echo "Tag successfully verified on remote after push error."
              else
                echo "Tag push failed and remote verification failed." >&2
                exit 1
              fi
            )

            gh workflow run "ci.yml" --ref "$TAG" -f mode="publish-tag"
          fi

  github-release:
    name: Publish GitHub Release and NPM package
    needs: [route, release-context, release-validation]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.run_release == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Create git tag and GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ needs.release-context.outputs.release_tag }}' || context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              core.info(`Release for ${tagName} already exists.`);
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) {
                 core.warning(`Error checking for release: ${error.message}`);
              }
            }

            if (!releaseExists) {
               try {
                   await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name: tagName,
                    name: tagName,
                    generate_release_notes: true,
                    draft: false,
                    prerelease: tagName.includes('-')
                  });
                  core.info(`Release for ${tagName} created.`);
               } catch (error) {
                  if (error.response && error.response.data && error.response.data.errors) {
                    const alreadyExists = error.response.data.errors.some(e => e.code === 'already_exists');
                    if (alreadyExists) {
                       core.info(`Release for ${tagName} already exists (caught during creation).`);
                       return;
                    }
                  }
                  throw error;
               }
            }

      - name: Publish package to npm
        if: ${{ !endsWith(github.ref_name, '-next') }}
        run: |
          npm ci
          npm run build
          TAG_ARG="latest"
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            TAG_ARG="next"
          fi
          npm publish --access=public --tag $TAG_ARG

      - name: Prepare next -next development version
        if: ${{ needs.release-context.outputs.prepare_next == 'true' }}
        run: |
          NEXT_DEV_VERSION=${{ needs.release-context.outputs.next_dev_version }}
          export NEXT_DEV_VERSION
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const nextVersion = process.env.NEXT_DEV_VERSION;
          const pkgPath = path.join(process.cwd(), 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = nextVersion;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

          const lockPath = path.join(process.cwd(), 'package-lock.json');
          if (fs.existsSync(lockPath)) {
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
            lock.version = nextVersion;
            if (lock.packages && lock.packages['']) {
              lock.packages[''].version = nextVersion;
            }
            fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + "\n");
          }
          NODE

      - name: Create next iteration pull request
        if: ${{ needs.release-context.outputs.prepare_next == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: prepare ${{ needs.release-context.outputs.next_dev_version }}"
          title: "chore: prepare ${{ needs.release-context.outputs.next_dev_version }}"
          body: |
            This pull request prepares the repository for the next development cycle.

            * Released version `${{ needs.release-context.outputs.current_version }}`
            * Bumps the package version to `${{ needs.release-context.outputs.next_dev_version }}` to continue `-next` development.
          branch: "chore/prepare-${{ needs.release-context.outputs.next_dev_version }}"
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
